<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bunniihaus — chọn bảng màu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F1EF;--panel:#FFFFFF;--ink:#1F1A1B;--mute:#7C7476;--line:rgba(31,26,27,.12);--on:#1F1A1B;--sans:'Inter',system-ui,sans-serif;--logo:'Tenor Sans',var(--sans)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
.wrap{max-width:1500px;margin:0 auto;padding:28px 20px 60px}
h1{font-family:var(--logo);font-weight:400;font-size:30px;letter-spacing:.01em}
.sub{color:var(--mute);margin-top:6px;max-width:720px;line-height:1.6}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:22px 0}
.opt{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,box-shadow .2s}
.opt:hover{border-color:var(--mute)}
.opt:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--on);box-shadow:0 0 0 1px var(--on)}
.opt b{font-weight:600;font-size:15px}
.opt small{color:var(--mute);font-size:12.5px;line-height:1.5}
.sw{display:flex;gap:0;border-radius:9px;overflow:hidden;height:34px;border:1px solid var(--line)}
.sw i{flex:1}
.stage{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.frame header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.frame header a{color:var(--ink)}
.desk{height:760px}
.desk iframe{width:100%;height:calc(100% - 41px);border:0;display:block}
.phone{display:none}
@media(min-width:1100px){
  .stage{grid-template-columns:minmax(0,1fr) 400px}
  .phone{display:block;height:760px}
  .phone iframe{width:390px;height:calc(100% - 41px);border:0;display:block;margin:0 auto}
}
@media(max-width:700px){.desk{height:80vh}}
@media(prefers-reduced-motion:reduce){.opt{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bunniihaus — chọn bảng màu</h1>
  <p class="sub">Bấm từng phương án để xem trang Home thật đổi màu (bên trái bản máy tính, bên phải bản điện thoại). Cuộn bên trong khung để xem hết các phần. Chọn xong, nhắn số hoặc tên phương án cho Claude (có thể trộn, ví dụ “nền số 3, hồng số 5”).</p>
  <div class="opts" id="opts"></div>
  <div class="stage">
    <div class="frame desk"><header><span id="lab">Máy tính</span><a id="open" href="/?pal=0" target="_blank" rel="noopener">Mở toàn trang</a></header><iframe id="fd" title="Home — máy tính" src="/?pal=0"></iframe></div>
    <div class="frame phone"><header><span>Điện thoại</span></header><iframe id="fm" title="Home — điện thoại" src="/?pal=0"></iframe></div>
  </div>
</div>
<script>
const OPTS = [
  {k:'0', name:'0 · Porcelain Rose', note:'Đã chọn ở vòng trước: trắng sứ, hồng là điểm nhấn duy nhất. Sạch, sáng.', sw:['#FFFFFF','#F7F3F1','#FCEFF2','#F25C84','#1C1718']},
  {k:'1', name:'1 · Peach Fuzz', note:'Pantone 2024. Đào mềm, ấm, khối mẫu hiếm nền cam đào rực, footer nâu cacao. Ngọt, dễ thương, rất "quà tặng".', sw:['#FFF7F2','#FFE6D8','#FFB49B','#F2667B','#3A2420']},
  {k:'2', name:'2 · Viva Magenta', note:'Pantone 2023. Nền trắng tinh, điểm nhấn magenta đậm phủ cả dải chữ chạy và khối mẫu hiếm. Táo bạo, thời trang, wow nhất.', sw:['#FFFFFF','#FBE8EC','#BB2649','#9A1B3A','#3D0E1E']},
  {k:'3', name:'3 · Digital Lavender', note:'Màu xu hướng WGSN. Tím oải hương loang sang hồng như mây. Mơ màng, Gen Z, khác biệt.', sw:['#FCFBFF','#EFE8FF','#E3D6FF','#F2649A','#241C3A']},
  {k:'4', name:'4 · Mocha Mousse', note:'Pantone 2025. Nâu mocha sữa + hồng, như quán cà phê dưới shop. Ấm, sang, rất "café chic".', sw:['#FAF6F1','#EFE5DA','#A47864','#D06A86','#2E211B']},
  {k:'5', name:'5 · Cotton Candy', note:'Kẹo bông: hồng kẹo + xanh baby, footer xanh navy. Tươi, trẻ, vui nhất.', sw:['#FBFDFF','#E8F3FA','#FFE4EF','#FF5C93','#1B2236']},
];
const box = document.getElementById('opts'), fd = document.getElementById('fd'), fm = document.getElementById('fm'), open = document.getElementById('open');
box.innerHTML = OPTS.map((o,i) => `<button class="opt" data-i="${i}" aria-pressed="${i===0}"><b>${o.name}</b><span class="sw">${o.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span><small>${o.note}</small></button>`).join('');
function pick(i){
  const o = OPTS[i], url = '/' + (o.k ? '?pal=' + o.k : '');
  fd.src = url; fm.src = url; open.href = url;
  box.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', b.dataset.i == i));
}
box.addEventListener('click', e => { const b = e.target.closest('.opt'); if(b) pick(+b.dataset.i); });
</script>
</body>
</html>
