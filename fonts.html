<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Font Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Plus+Jakarta+Sans:ital,wght@0,300..700;1,300..700&family=Be+Vietnam+Pro:wght@300;400;500;600&family=Inter+Tight:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: specimen sheet · genre: playful · theme: brand (Cotton Candy) · a font chooser for the owner, not a public page
 * axes: one panel per pairing · contrast: pass · v2.0.0 */
:root{
  --ivory:#FBFDFF; --sand:#E8F3FA; --blush:#FFEAF1; --ink:#1B2236; --soft:#46506A; --mute:#5C6783; --line:rgba(27,34,54,.10); --line-2:rgba(27,34,54,.16);
  --pink:#FF5C93; --pink-deep:#D23369; --pink-text:#F04C86; --pink-ink:#C42A60; --paper:#FFFBFD; --card:#FFFFFF;
  --logo:'Tenor Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--ivory);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.intro{padding:48px 0 24px}
header.intro .logo{font-family:var(--logo);font-size:28px}
header.intro .logo em{font-style:normal;color:var(--pink-text)}
header.intro p{margin-top:12px;color:var(--soft);max-width:640px;line-height:1.6}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.jump a{padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink);text-decoration:none;font-size:14px}
.jump a:hover{border-color:var(--ink)}
.jump a:focus-visible,.btn:focus-visible{outline:2px solid var(--pink-deep);outline-offset:3px}

.pair{border-top:1px solid var(--line);padding:48px 0 56px}
.pair-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:28px;font-family:'Inter',sans-serif}
.pair-head b{font-size:13px;font-weight:600;color:var(--paper);background:var(--pink-deep);padding:4px 12px;border-radius:999px}
.pair-head .rec{background:var(--ink)}
.pair-head span{font-size:15px;font-weight:500}
.pair-head small{font-size:14px;color:var(--mute)}
.grid{display:grid;gap:40px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px}}

/* specimen: the same blocks in every pairing, fonts swapped by variables */
.spec{font-family:var(--body)}
.badge{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--blush);color:var(--pink-ink);font-weight:600;font-size:13px}
.addr{font-size:13px;color:var(--soft);margin-left:8px}
.spec h1{font-family:var(--disp);font-weight:var(--h1w);font-size:clamp(56px,7vw,96px);line-height:.95;letter-spacing:var(--h1ls);margin:20px 0 20px;font-variation-settings:var(--fvs)}
.spec h1 span{color:var(--pink-text);font-style:var(--h1it)}
.spec .lead{font-size:16px;line-height:1.7;color:var(--soft);font-weight:var(--bodyw);max-width:520px}
.spec .lead em{font-style:italic;color:var(--pink-deep)}
.ctas{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:48px;padding:0 24px;border-radius:999px;font-family:var(--body);font-size:15px;font-weight:500;text-decoration:none}
.btn.ink{background:var(--ink);color:var(--ivory)}
.btn.line{border:1px solid var(--line-2);color:var(--ink)}
.spec h2{font-family:var(--disp);font-weight:var(--h2w);font-size:clamp(36px,4vw,52px);line-height:1.05;letter-spacing:var(--h2ls);font-variation-settings:var(--fvs)}
.qa{border-top:1px solid var(--line)}
.qa:last-of-type{border-bottom:1px solid var(--line)}
.qa h3{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-family:var(--qfam);font-weight:var(--qw);font-size:20px;letter-spacing:var(--qls);line-height:1.3;font-variation-settings:var(--fvs)}
.qa h3 i{flex:0 0 32px;height:32px;border-radius:50%;border:1px solid var(--line-2);position:relative}
.qa h3 i::before,.qa h3 i::after{content:'';position:absolute;left:50%;top:50%;width:11px;height:1.2px;background:var(--ink);transform:translate(-50%,-50%)}
.qa h3 i::after{transform:translate(-50%,-50%) rotate(90deg)}
.qa.open h3 i{background:var(--pink-deep);border-color:var(--pink-deep)}
.qa.open h3 i::before{background:var(--paper)}
.qa.open h3 i::after{display:none}
.qa p{padding:0 48px 16px 0;font-size:15px;line-height:1.7;color:var(--soft);font-weight:var(--bodyw)}
.faq{margin-top:20px}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;margin-top:28px;padding:12px;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.card img{width:96px;height:96px;object-fit:contain;border-radius:14px}
.card .n{font-size:15px;line-height:1.3}
.card .m{display:flex;justify-content:space-between;margin-top:4px;font-size:13px;color:var(--mute)}
.card .m b{font-weight:600;color:var(--ink)}

/* pairings */
.p0{--disp:'Inter Tight',sans-serif;--body:'Inter',sans-serif;--qfam:var(--disp);--h1w:300;--h1ls:-.05em;--h2w:300;--h2ls:-.035em;--qw:400;--qls:-.02em;--bodyw:300;--h1it:normal;--fvs:normal}
.pA{--disp:'Fraunces',serif;--body:'Plus Jakarta Sans',sans-serif;--qfam:var(--disp);--h1w:400;--h1ls:-.025em;--h2w:400;--h2ls:-.02em;--qw:400;--qls:-.01em;--bodyw:400;--h1it:italic;--fvs:'SOFT' 100,'opsz' 96}
.pB{--disp:'Bricolage Grotesque',sans-serif;--body:'Plus Jakarta Sans',sans-serif;--qfam:var(--disp);--h1w:500;--h1ls:-.04em;--h2w:500;--h2ls:-.03em;--qw:500;--qls:-.015em;--bodyw:400;--h1it:normal;--fvs:normal}
.pC{--disp:'Newsreader',serif;--body:'Be Vietnam Pro',sans-serif;--qfam:var(--disp);--h1w:400;--h1ls:-.03em;--h2w:400;--h2ls:-.02em;--qw:400;--qls:-.005em;--bodyw:300;--h1it:italic;--fvs:normal}
.pD{--disp:'Plus Jakarta Sans',sans-serif;--body:'Plus Jakarta Sans',sans-serif;--qfam:var(--disp);--h1w:500;--h1ls:-.045em;--h2w:500;--h2ls:-.035em;--qw:500;--qls:-.02em;--bodyw:400;--h1it:normal;--fvs:normal}
</style>
</head>
<body>
<header class="intro wrap">
  <div class="logo">Bunnii<em>haus</em></div>
  <p>Cùng một nội dung, đổi font. Logo Tenor Sans và màu Cotton Candy giữ nguyên. Tất cả font dưới đây đều hỗ trợ tiếng Việt đầy đủ dấu.</p>
  <nav class="jump"><a href="#p0">0. Hiện tại</a><a href="#pA">A. Fraunces</a><a href="#pB">B. Bricolage</a><a href="#pC">C. Newsreader</a><a href="#pD">D. Jakarta</a></nav>
</header>
<main class="wrap" id="pairs"></main>
<script>
const PAIRS = [
  ['p0','0','Inter Tight + Inter','Bản đang dùng: mảnh, gọn, nhưng khá phổ thông'],
  ['pA','A','Fraunces + Plus Jakarta Sans','Serif bo tròn mềm như thú bông, chữ "stays" nghiêng; ấm và có cá tính (đề xuất)'],
  ['pB','B','Bricolage Grotesque + Plus Jakarta Sans','Sans có nét lạ, trẻ trung, hơi "Gen Z"'],
  ['pC','C','Newsreader + Be Vietnam Pro','Serif kiểu tạp chí, thanh lịch, hợp tông Aesop'],
  ['pD','D','Plus Jakarta Sans','Một font duy nhất, tròn và thân thiện hơn Inter; thay đổi ít nhất'],
];
const SPEC = `
<div class="grid">
  <div class="spec">
    <span class="badge">100% Authentic Jellycat</span><span class="addr">207 Hoàng Sa, TP.HCM</span>
    <h1>The gift<br>that <span>stays</span></h1>
    <p class="lead">Một cửa hàng gấu bông Jellycat chính hãng nhỏ nép mình trên tầng 1, giữa một con phố trung tâm Sài Gòn. Ở đây, mỗi bé gấu là một câu chuyện, được cậu chủ nhỏ 2K++ chọn về bằng cả tâm huyết, cho những món quà gửi người <em>“thương”</em>.</p>
    <div class="ctas"><a class="btn ink" href="#">Xem bộ sưu tập</a><a class="btn line" href="#">Chat with us</a></div>
  </div>
  <div class="spec">
    <h2>Good to know</h2>
    <div class="faq">
      <div class="qa open"><h3>Sản phẩm ở Bunniihaus có chính hãng không?<i></i></h3><p>Có. Tất cả sản phẩm đều chính hãng, đủ tag gốc và dustbag. Bạn có thể ghé 207 Hoàng Sa, Quận 1 để xem tận tay.</p></div>
      <div class="qa"><h3>Bunniihaus ở đâu?<i></i></h3></div>
      <div class="qa"><h3>Giá sản phẩm khoảng bao nhiêu?<i></i></h3></div>
      <div class="qa"><h3>Chọn size thế nào cho đúng?<i></i></h3></div>
    </div>
    <div class="card"><img src="img/home/Azure%20Huge%20Bunny.webp" alt="Bashful Luxe Bunny Azure"><div><div class="n">Bashful Luxe Bunny Azure</div><div class="m"><span>Huge</span><b>4.800k</b></div></div></div>
  </div>
</div>`;
document.getElementById('pairs').innerHTML = PAIRS.map(([c,k,name,note]) => `<section class="pair ${c}" id="${c}"><div class="pair-head"><b class="${k==='A'?'rec':''}">${k}</b><span>${name}</span><small>${note}</small></div>${SPEC}</section>`).join('');
</script>
</body>
</html>
